on:
  push:
    branches:
      - production
  workflow_dispatch:

concurrency:
  group: deploy-certification-api
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 116.206.196.211 >> ~/.ssh/known_hosts

      - name: Deploy to server
        run: |
          ssh -i ~/.ssh/id_ed25519 lspgatensi-certification-api@116.206.196.211 << 'EOF'
            set -e

            cd /home/lspgatensi-certification-api/htdocs/certification-api.lspgatensi.id

            echo "== Current user =="
            whoami

            echo "== Current folder =="
            pwd

            echo "== Current branch =="
            git branch --show-current

            echo "== Pull latest code from production branch =="
            git fetch origin production
            git checkout production
            git pull --ff-only origin production

            echo "== Install composer dependencies =="
            composer install --no-dev --optimize-autoloader --no-interaction

            echo "== Laravel cache clear =="
            php artisan optimize:clear

            echo "== Cache production config =="
            php artisan config:cache
            php artisan view:cache

            echo "== Cache route if possible =="
            php artisan route:cache || true

            echo "== Restart queue if used =="
            php artisan queue:restart || true

            echo "== Deploy done =="
          EOF
