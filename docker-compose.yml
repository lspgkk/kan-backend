# For more information: https://laravel.com/docs/sail
services:
    laravel.test:
        build:
            context: ./docker/8.4
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP:-1000}'
        pull_policy: build
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
            # Queue & cache via Redis
            QUEUE_CONNECTION: '${QUEUE_CONNECTION:-redis}'
            CACHE_STORE: '${CACHE_STORE:-redis}'
            REDIS_CLIENT: predis
            REDIS_HOST: '${DOCKER_REDIS_HOST:-redis}'
            REDIS_PORT: '${DOCKER_REDIS_PORT:-6379}'
            # Mail via Mailpit
            MAIL_MAILER: '${MAIL_MAILER:-smtp}'
            MAIL_HOST: '${DOCKER_MAIL_HOST:-mailpit}'
            MAIL_PORT: '${DOCKER_MAIL_PORT:-1025}'
        volumes:
            - '.:/var/www/html'
            # Keep vendor & node_modules as named volumes for performance
            - 'sail-vendor:/var/www/html/vendor'
            - 'sail-node_modules:/var/www/html/node_modules'
        networks:
            - sail
        depends_on:
            redis:
                condition: service_healthy
            mailpit:
                condition: service_started

    redis:
        image: 'redis:alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            retries: 3
            timeout: 5s

    mailpit:
        image: 'axllent/mailpit:latest'
        ports:
            - '${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
        networks:
            - sail

networks:
    sail:
        driver: bridge

volumes:
    sail-vendor:
    sail-node_modules:
    sail-redis:
